<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Steps</title>
  <!-- Drei Pillen als Treppe: jede Einheit eine Stufe.

       Kein Buchstabe. Ein L hätte nur den Namen wiederholt — die Treppe sagt,
       worum es geht, und funktioniert in jeder Sprache und in jeder Größe.

       Pillen, weil rounded-pill die meistbenutzte Form der ganzen App ist:
       jeder Knopf, jeder Chip, die Navigationsleiste unten. Das Icon soll aus
       demselben Baukasten stammen wie das, was sich hinter ihm öffnet.

       Der Versatz von sieben Einheiten nach rechts bei zehn Einheiten Breite
       ist der Grund, warum die Stufen auch klein getrennt bleiben: bei mehr
       Überlappung verkleben sie auf 16 Pixeln zu einem Balken.

       Achtung beim Ändern: dieselben Zahlen stecken in scripts/icon-bauen.mjs,
       das apple-icon.png und favicon.ico erzeugt. Ändert man sie hier allein,
       laufen Browser-Tab und Startbildschirm auseinander. -->
  <rect width="32" height="32" rx="8" fill="#0d101b"/>
  <g fill="#b3a0ff">
    <rect x="4" y="20.5" width="10" height="6" rx="3"/>
    <rect x="11" y="13" width="10" height="6" rx="3"/>
    <rect x="18" y="5.5" width="10" height="6" rx="3"/>
  </g>
</svg>
